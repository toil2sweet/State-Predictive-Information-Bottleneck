# HSIC-SPIB configuration for CTC double-well (two-well) potential
# Based on Double_Well_CTC_config.ini; enables HSIC bottleneck while retaining
# SPIB label refinement, state-number identification, and TS detection/plots.
# Trajectory: double-well_CTC/traj_data.npy (see prepare_spib_data.py)
# Expected metastable state number ~ 2.
#
# Run:
#   python test_model_advanced.py -config examples/Double_Well_hsic_config.ini
#
# Optional: regenerate traj_data / init labels
#   python double-well_CTC/prepare_spib_data.py

[Model Parameters]
# Time delay delta t (# of minimal time resolution steps)
dt = [100]

# RC dimension
d = [1]

# Nonlinear encoder (SPIB paper style for analytical potentials)
encoder_type = Linear

neuron_num1 = [16]
neuron_num2 = [16]


[Training Parameters]

batch_size = 512
threshold = 0.01
patience = 2
refinements = 8
lr_scheduler_step_size = 5
lr_scheduler_gamma = 1
log_interval = 10000

learning_rate = [1e-3]

# Training beta (beta_kl only for original_spib / hybrid_spib)
beta = [0.03]

[Data]
traj_data = [double-well_CTC/traj_data.npy]
initial_labels = [double-well_CTC/init_label5.npy]

# Leave empty / omit value for uniform weights
traj_weights


[Other Controls]
seed = [0]
UpdateLabel = True
SaveTrajResults = True

# Plot learned labels + TS figures under fig/
SaveLabelPlot = True
fig_dir = fig


[HSIC-SPIB]
# Loss mode: original_spib | hsic_spib | hybrid_spib
loss_mode = hsic_spib

beta_x = 1.0
lambda_y = 1.0
normalized_hsic = True
decoder_on_mean = True

kernel_z = rbf
kernel_x = rbf
kernel_y = delta

# Transition-state identification (decoder K_i)
DetectTransitionStates = True
eps_ts = 0.005
ts_require_cross_state = True
ts_window = 1

# Free-energy plot: F = -log(P)/fe_beta from this trajectory (same method as
# four-well free_energy_with_TS). Use fe_beta=3 so F stays within vmax=3 and
# transitional colors appear (fe_beta=1 pushes most bins above vmax -> red sea).
fe_beta = 3.0
# CTC-style analytical potential overlay (potential_with_TS only)
ts_potential = double_well


[CTC-Style TS]
# Comparison-only post-processing; this does not train or run CTC.
enabled = True
event_max_gap = 1
min_event_frames = 1
top_k = 10
density_method = histogram2d
density_bins = 100
# Double-Well has one learned transition pair, so rank representatives globally.
selection_scope = global
state_pairs = all
save_plots = True
