# HSIC-SPIB configuration for CTC double-well (two-well) potential.
# Same training settings as examples/Double_Well_hsic_config.ini. NSCC keeps
# the original CTC arrays under double-well_CTC/; HKU uses the generated
# Langevin trajectory in this checkout under traj_gen/.
#
# Run on HKU after gpu-interactive:
#   spib_run examples/Double_Well_hsic_hku_config.ini
#
# Optional: regenerate trajectory / five-state labels
#   python traj_gen/generate_double_well.py --seed 2026

[Model Parameters]
# Time delay delta t (# of minimal time resolution steps)
dt = [100]

# RC dimension
d = [1]

# Nonlinear encoder (SPIB paper style for analytical potentials)
encoder_type = Linear

neuron_num1 = [16]
neuron_num2 = [16]


[Training Parameters]

batch_size = 512
threshold = 0.01
patience = 2
refinements = 8
lr_scheduler_step_size = 5
lr_scheduler_gamma = 1
log_interval = 10000

learning_rate = [1e-3]

# Training beta (beta_kl only for original_spib / hybrid_spib)
beta = [0.03]

[Data]
traj_data = [traj_gen/Double_Well_CTC_1000000frames_seed2026.npy]
initial_labels = [traj_gen/Double_Well_CTC_1000000frames_seed2026_init_label5.npy]

# Leave empty / omit value for uniform weights
traj_weights


[Other Controls]
seed = [0]
UpdateLabel = True
SaveTrajResults = True

# Plot learned labels + TS figures under fig/
SaveLabelPlot = True
fig_dir = fig


[HSIC-SPIB]
# Loss mode: original_spib | hsic_spib | hybrid_spib
loss_mode = hsic_spib

beta_x = 1.0
lambda_y = 1.0
normalized_hsic = True
decoder_on_mean = True

kernel_z = rbf
kernel_x = rbf
kernel_y = delta

# Transition-state identification (decoder K_i)
DetectTransitionStates = True
#0.005
eps_ts = 0.001
ts_require_cross_state = True
ts_window = 1

# Free-energy plot: F = -log(P)/fe_beta from this trajectory (same method as
# four-well free_energy_with_TS). Use fe_beta=3 so F stays within vmax=3 and
# transitional colors appear (fe_beta=1 pushes most bins above vmax -> red sea).
fe_beta = 3.0
# CTC-style analytical potential overlay (potential_with_TS only)
ts_potential = double_well
