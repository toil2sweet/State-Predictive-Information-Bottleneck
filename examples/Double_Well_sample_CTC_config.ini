# SPIB configuration for double-well benchmark (scheme A: CTC traj.npy)
# Initial labels: overcomplete guess (D=5), x-axis discretization (SPIB_Demo recipe).
# Potential differs from SPIB paper U_DW; see double-well_CTC/prepare_spib_data.py.
#
# Run (original SPIB only — no label/TS auto-plots):
#   python test_model_advanced.py -config examples/Double_Well_CTC_config.ini
#
# For HSIC-SPIB + state-number/TS figures on the same data:
#   python test_model_advanced.py -config examples/Double_Well_hsic_config.ini

[Model Parameters]
# Time delay delta t (# of minimal time resolution steps); tune if needed
dt = [100]

# RC dimension (SPIB paper double-well: d=1)
d = [1]

# SPIB paper uses Nonlinear encoder for analytical potentials
encoder_type = Nonlinear

neuron_num1 = [16]
neuron_num2 = [16]


[Training Parameters]

batch_size = 512
threshold = 0.01
patience = 2
refinements = 8
lr_scheduler_step_size = 5
lr_scheduler_gamma = 1
log_interval = 10000

learning_rate = [1e-3]

# SPIB paper double-well: beta ~ 0.03
beta = [0.03]

[Data]
traj_data = [double-well_CTC/traj_data.npy]
initial_labels = [double-well_CTC/init_label5.npy]

traj_weights

[Other Controls]
seed = [0]
UpdateLabel = True
SaveTrajResults = True
