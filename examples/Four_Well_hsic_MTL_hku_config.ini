# HSIC-SPIB Four-Well multi-task (MTL) configuration for the HKU CS GPU farm.
#
# If dt contains one lag, test_model_advanced.py trains the current single-head
# HSIC-SPIB model. If dt contains several lags, it trains one shared encoder
# with a separate decoder head per Δt and writes combined lag figures.
#
# Expected Four-Well metastable numbers: dt=50 -> 4, dt=200 -> 3, dt=1000 -> 2
#
# Run on HKU after gpu-interactive:
#   spib_run examples/Four_Well_hsic_MTL_hku_config.ini

[Model Parameters]
# Time delay delta t in terms of # of minimal time resolution of the trajectory data
dt = [50, 200, 1000]

# Dimension of RC or bottleneck
d = [1]

# Encoder type (Linear or Nonlinear)
encoder_type = Linear

# Number of nodes in each hidden layer of the encoder
neuron_num1 = [16]

# Number of nodes in each hidden layer of the decoder
neuron_num2 = [16]


[Training Parameters]

batch_size = 512

# SGD frames per epoch. 0 = use all aligned training frames.
# 300000 matches the demo compute budget; label refinement, state-number,
# and TS detection still use the full aligned data.
epoch_sample_size = 300000

# Threshold in terms of the change of the predicted state population for measuring the convergence of training
threshold = 0.01

# Number of epochs with the change of the state population smaller than the threshold after which this iteration of training finishes
patience = 2

# Number of refinements (needed for state-number pruning from overcomplete labels)
refinements = 8

# Period of learning rate decay
lr_scheduler_step_size = 5

# Multiplicative factor of learning rate decay. Default: 1 (No learning rate decay)
lr_scheduler_gamma = 1

# By default, we save the model every 10000 steps
log_interval = 10000

# Initial learning rate of Adam optimizer
learning_rate = [1e-3]

# Hyper-parameter beta (used as beta_kl only in original_spib / hybrid_spib)
beta = [1e-2]

[Data]
# Path to the trajectory data
traj_data = [traj_gen/Four_Well_60000time_seed2026.npy]
# For mulitple trajectroies, traj_data = [path to traj0 data, path to traj1 data, path to traj2 data]

# Path to the initial state labels (overcomplete; state number is refined during training)
initial_labels = [traj_gen/Four_Well_60000time_seed2026_init_label10.npy]
# For mulitple trajectroies, initial_labels = [path to traj0 labels, path to traj1 labels, path to traj2 labels]

# Path to the weights of the samples, by default all the samples have the same weights
traj_weights
# traj_weights = [path to traj weights]


[Other Controls]
# Random seed
seed = [0]

# Whether to refine the labels during the training process (required for state-number identification)
UpdateLabel = True

# Whether save trajectory results
SaveTrajResults = True

# Whether to plot/save learned state labels under fig/ (SPIB_Demo style)
SaveLabelPlot = True
fig_dir = fig


[HSIC-SPIB]
# Loss mode: original_spib | hsic_spib | hybrid_spib
# hsic_spib = CE - lambda_y * HSIC(Z,Y) + beta_x * HSIC(Z,X)  (no KL)
loss_mode = hsic_spib

# Weight for input compression term +HSIC(Z, X)
beta_x = 1.0

# Weight for predictive dependence term -HSIC(Z, Y)
lambda_y = 1.0

# Use normalized HSIC (recommended for stable scales)
normalized_hsic = True

# Decode from z_mean in HSIC modes (more stable with HSIC on mu)
decoder_on_mean = True

# Kernel types
kernel_z = rbf
kernel_x = rbf
kernel_y = delta

# Transition-state identification from decoder K_i (after state-number refinement)
DetectTransitionStates = True
eps_ts = 0.005
ts_require_cross_state = True
ts_window = 1

# TS visualization (written under fig/ when SaveLabelPlot=True)
fe_beta = 3.0
ts_potential = four_well


[CTC-Style TS]
# Comparison-only post-processing; this does not train or run CTC.
enabled = True
event_max_gap = 1
min_event_frames = 1
top_k = 10
density_method = histogram2d
density_bins = 100
selection_scope = per_pair
state_pairs = all
save_plots = True
