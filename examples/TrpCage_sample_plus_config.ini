# Original 2024 SPIB (variational IB) on Trp-cage, 2024 JCTC / tutorial3 protocol.
#
# This is the paper baseline (CE + beta * KL, isotropic encoder variance).
# HSIC-SPIB+ uses the same prepared arrays with examples/TrpCage_hsic_plus_config.ini.
#
# Prepare features from the local DESRES Anton trajectory (Science 2011, 290 K):
#   python trpcage/prepare_spib_data.py
#
# HKU interactive (arrays live under the runtime checkout):
#   bash hku/run.sh examples/TrpCage_sample_plus_config.ini
#
# NSCC interactive (project storage, not home quota):
#   bash nscc/sync_trpcage_data.sh
#   spib_run examples/TrpCage_sample_plus_config.ini
#
# Local run:
#   python test_model_advanced.py -config examples/TrpCage_sample_plus_config.ini
#
# Figures match tutorial3_trpcage.ipynb: latent FE (IB_0, IB_1) and
# metastable label map with dashed FE contours.
#
# Protocol (tutorial3_trpcage.ipynb):
#   - Features: 153 closest-heavy residue-residue distances, DataNormalize(mean/std)
#   - Init labels: TICA(lag=200, dim=3) + MiniBatchKMeans(K=200)
#   - Encoder: Nonlinear, d=2, 64/64, isotropic log-variance
#   - Loss: original_spib (not HSIC)
#   - dt=500 frames = 100 ns at 0.2 ns/frame (large / coarse resolution)
# Moderate resolution in the 2024 paper is dt=50 (~10 ns); add it to dt after
# the coarse run. This config matches tutorial3's loss-plateau refinement
# (tolerance=0.002) and its 100 contiguous trajectory-block train/test split.

[Model Parameters]
dt = [50]

d = [2]

encoder_type = Nonlinear

neuron_num1 = [64]
neuron_num2 = [64]


[Training Parameters]

batch_size = 4096
# Retained for legacy population convergence only; unused by loss mode.
threshold = 0.01
tolerance = 0.002
convergence_mode = loss
# Notebook convergence occurs within 33 epochs in its first refinement.
# This guard fails clearly instead of consuming a GPU allocation indefinitely.
max_epochs_per_refinement = 200
patience = 2
refinements = 15
lr_scheduler_step_size = 5
lr_scheduler_gamma = 1
log_interval = 20000

learning_rate = [3e-5]
beta = [1e-3]

[Data]
traj_data = [trpcage/traj_data.npy]
initial_labels = [trpcage/init_label_tica_kmeans200_lag200_index.npy]
data_mean = trpcage/data_mean.npy
data_std = trpcage/data_std.npy
# tutorial3: split the ultra-long trajectory into 100 contiguous segments,
# randomize segment membership, and reserve 10 segments for validation.
split_mode = trajectory_blocks
split_num_blocks = 100

traj_weights


[Other Controls]
seed = [0]
UpdateLabel = True
SaveTrajResults = True
SaveLabelPlot = True
fig_dir = fig


[HSIC-SPIB]
# Architecture flags for the 2024 protocol. loss_mode=original_spib is CE+KL.
loss_mode = original_spib

encoder_var_mode = isotropic
eps_rho = 0.0

DetectTransitionStates = False

fe_beta = 1.0
ts_potential = trpcage
