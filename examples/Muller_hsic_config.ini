# HSIC-SPIB configuration for Müller-Brown potential (three metastable basins)
# Trajectory: ts-dar/data/muller/muller.npy (Brownian dynamics, T ≈ 0.9).
#
# Initial labels: same as double/four-well — equal-width overcomplete bins along x
# (K=6); see muller/prepare_spib_data.py (SPIB_Demo recipe).
#   python muller/prepare_spib_data.py --state-num 6
#
# Free-energy plot:
#   fe_beta = 0.9  matches simulation temperature (F ≈ -kT ln P with kT=0.9)
#   fe_vmax = 8.0  wider color scale than four/double-well (vmax=3) so barriers show
#
# Run:
#   python test_model_advanced.py -config examples/Muller_hsic_config.ini

[Model Parameters]
# Time delay delta t (# of minimal time resolution steps)
# Müller saving interval is 0.01 (TS-DAR); dt=10 is a short lag for 3-basin kinetics
dt = [10]

# RC dimension
d = [1]

encoder_type = Nonlinear

neuron_num1 = [16]
neuron_num2 = [16]


[Training Parameters]

batch_size = 512
threshold = 0.01
patience = 2
# Overcomplete labels -> prune toward ~3 basins
refinements = 8
lr_scheduler_step_size = 5
lr_scheduler_gamma = 1
log_interval = 10000

learning_rate = [1e-3]

# Training beta (beta_kl only for original_spib / hybrid_spib)
beta = [0.01]

[Data]
traj_data = [muller/traj_data.npy]
initial_labels = [muller/init_label10.npy]

# Leave empty / omit value for uniform weights
traj_weights


[Other Controls]
seed = [0]
UpdateLabel = True
SaveTrajResults = True

# Plot learned labels + TS figures under fig/
SaveLabelPlot = True
fig_dir = fig


[HSIC-SPIB]
# Loss mode: original_spib | hsic_spib | hybrid_spib
loss_mode = hsic_spib

beta_x = 1.0
lambda_y = 1.0
normalized_hsic = True
decoder_on_mean = True

kernel_z = rbf
kernel_x = rbf
kernel_y = delta

# Transition-state identification (decoder K_i)
DetectTransitionStates = True
eps_ts = 0.01
ts_require_cross_state = True
ts_window = 1

# Free-energy: F = -log(P)/fe_beta
# Use simulation temperature T≈0.9 (not 3.0 style of four/double-well demos).
fe_beta = 0.9
fe_vmax = 8.0
# Analytical potential overlay for potential_with_TS
ts_potential = muller
