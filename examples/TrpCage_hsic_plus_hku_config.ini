# HSIC-SPIB+ on Trp-cage folding trajectory (DESRES pairwise distances)
#
# Prepare the same arrays used by examples/TrpCage_sample_plus_config.ini:
#   python trpcage/prepare_spib_data.py
#
# Run (coarse 100 ns first; append dt=50 only after it converges):
#   python test_model_advanced.py -config examples/TrpCage_hsic_plus_config.ini
#
# Protocol (2024 JCTC / tutorial3):
#   - Features: 153 minimal residue-residue distances, DataNormalize(mean/std)
#   - Init labels: TICA(lag=200, dim=3) + MiniBatchKMeans(K=200)
#   - HSIC: kernel_x=linear (high-dim X), isotropic encoder variance
#   - Plots: SPIB latent FE + labels + state-number vs refinement
# Frame spacing: 0.2 ns/frame; dt=500 ~ 100 ns (coarse); dt=50 ~ 10 ns (finer)

[Model Parameters]
# Match the converged tutorial3 baseline first: 100 ns / coarse / ~4 states.
# Once this run is stable, change to [50] for the ~10-state 10 ns model.
dt = [100]

d = [2]

encoder_type = Nonlinear

neuron_num1 = [64]
neuron_num2 = [64]


[Training Parameters]

# The original Trp-cage baseline converges with loss-plateau refinements over
# all frames. Population-only convergence at batch_size=256 is noisy for HSIC.
# B=1024 controls the O(B^2) HSIC cost while making its epoch average stable.
batch_size = 1024
# Retained for legacy population mode; unused by convergence_mode=loss.
threshold = 0.01
tolerance = 0.005
convergence_mode = loss
max_epochs_per_refinement = 200
patience = 2
refinements = 15
lr_scheduler_step_size = 5
lr_scheduler_gamma = 1
log_interval = 20000

learning_rate = [3e-5]
beta = [1e-3]

[Data]
traj_data = [trpcage/traj_data.npy]
initial_labels = [trpcage/init_label_tica_kmeans200_lag200_index.npy]
data_mean = trpcage/data_mean.npy
data_std = trpcage/data_std.npy
# Same 100 contiguous-trajectory train/test split as tutorial3 and
# examples/TrpCage_sample_plus_config.ini. No lagged pair crosses a block edge.
split_mode = trajectory_blocks
split_num_blocks = 100

traj_weights


[Other Controls]
seed = [0]
UpdateLabel = True
SaveTrajResults = True
SaveLabelPlot = True
fig_dir = fig


[HSIC-SPIB]
loss_mode = hsic_spib

# Normalized HSIC is O(1), whereas CE begins near log(200). The toy-system
# weights 1/1 become overly dominant after label pruning on this protein.
# Start with a CE-led, weakly regularized objective; tune only after the
# coarse four-state model is reproducible.
beta_x = 0.01
lambda_y = 0.1
normalized_hsic = True
decoder_on_mean = True

kernel_z = rbf
kernel_x = linear
kernel_y = delta

eps_rho = 0.0
encoder_var_mode = isotropic

# Decoder K_i transition-state candidates, following the Double/Four-Well
# HSIC-SPIB extension. A frame is retained when its top-two future-state
# probabilities are nearly tied and its local trajectory window crosses a
# learned-state boundary. These are candidates, not committor-validated TS.
DetectTransitionStates = True
eps_ts = 0.005
ts_require_cross_state = True
ts_window = 1

fe_beta = 1.0
# Protein figures use the learned 2D SPIB latent space; there is no analytical
# Trp-cage potential surface.
ts_potential = trpcage
