# HSIC-SPIB+ on Müller-Brown (diagonal three-basin landscape)
#
# Difference vs examples/Muller_hsic_config.ini:
#   - Initial labels: xy_kmeans overcomplete clusters (not x-bins)
#   - Latent dim d=2 (geometry of slanted basins)
#   - Decoder head pruning via update_model (core HSIC-SPIB+); optional eps_rho
#   - dt grid to inspect state-number vs lag (resolution)
#
# Prepare labels first (default method=xy_kmeans, K=30):
#   python muller/prepare_spib_data.py --method xy_kmeans --n-clusters 30
#
# Run:
#   python test_model_advanced.py -config examples/Muller_hsic_plus_config.ini
#
# Optional TICA+kmeans labels instead:
#   python muller/prepare_spib_data.py --method tica_kmeans --n-clusters 30 --tica-lag 10
#   then set initial_labels = [muller/init_label_tica_kmeans30_lag10.npy]

[Model Parameters]
# Saving interval in TS-DAR Müller traj is 0.01; scan lags for state-number trend
dt = [5]

# 2D bottleneck for slanted basins
d = [1]

encoder_type = Linear

neuron_num1 = [32]
neuron_num2 = [32]


[Training Parameters]

batch_size = 512
threshold = 0.01
patience = 2
refinements = 10
lr_scheduler_step_size = 5
lr_scheduler_gamma = 1
log_interval = 10000

learning_rate = [1e-3]
beta = [0.01]

[Data]
traj_data = [muller/traj_data.npy]
initial_labels = [muller/init_label_kmeans12.npy]

traj_weights


[Other Controls]
seed = [0]
UpdateLabel = True
SaveTrajResults = True
SaveLabelPlot = True
fig_dir = fig


[HSIC-SPIB]
loss_mode = hsic_spib

beta_x = 1.0
lambda_y = 1.0
normalized_hsic = True
decoder_on_mean = True

kernel_z = rbf
kernel_x = rbf
kernel_y = delta

# HSIC-SPIB+: population prune threshold (0 keeps all non-empty states)
eps_rho = 0.0
encoder_var_mode = input_dependent

DetectTransitionStates = True
eps_ts = 0.01
ts_require_cross_state = True
ts_window = 1

fe_beta = 0.9
fe_vmax = 8.0
ts_potential = muller
